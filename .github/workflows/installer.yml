name: installer

# lint     - shellcheck, PowerShell parse/analyzer, helm lint + template (both profiles),
#            and no secret from the private chart repo leaked into charts/
# linux    - the real thing on Ubuntu: install.sh (k3s + charts, pods Ready, UI
#            healthy), install.sh again (upgrade path), uninstall.sh (k3s and
#            ~/.rekognitor gone). The logs are uploaded as an artifact.
# macos    - install.sh/uninstall.sh parse and run --help under macOS' bash 3.2
#            (hosted macOS runners cannot run Docker, so no cluster here)
# windows  - PSScriptAnalyzer on the .ps1 files (hosted runners have no WSL2)

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: installer-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.21.4
      - name: shellcheck
        run: shellcheck -x install.sh uninstall.sh tools/sync-charts.sh
      - name: helm lint + template (light and full)
        run: |
          set -euo pipefail
          for profile in light full; do
            for dir in charts/*/; do
              chart=$(basename "$dir")
              values=()
              [[ -f "values/$profile/$chart.yaml" ]] && values=(-f "values/$profile/$chart.yaml")
              helm lint "$dir" "${values[@]}"
              helm template "$chart" "$dir" -n rekognitor "${values[@]}" >/dev/null
            done
          done
      - name: no secrets in charts/
        run: |
          set -euo pipefail
          grep -qE '^  CLIENT_ID: "set-by-installer"$' charts/streamer/values.yaml
          grep -qE '^  SECRET: "set-by-installer"$' charts/streamer/values.yaml
          grep -qE '^  authSecret: "set-by-installer"$' charts/mqtt/values.yaml

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: install.sh --check
        run: ./install.sh --check 2>&1 | tee check.log
      - name: install.sh
        run: ./install.sh --yes --profile light 2>&1 | tee install.log
      - name: verify
        run: |
          set -euo pipefail
          source ~/.rekognitor/env
          kubectl -n rekognitor get pods -o wide
          test "$(kubectl -n rekognitor get pods --no-headers | grep -vc ' Running ')" -eq 0
          curl -fsS http://127.0.0.1:31881/healthz
          curl -fsS http://127.0.0.1:31881/rtsp/health
          test "$(stat -c %a ~/.rekognitor/secrets)" = 600
          ! kubectl -n rekognitor get statefulset streamer -o yaml | grep -q set-by-installer
      - name: install.sh again (upgrade)
        run: ./install.sh --yes 2>&1 | tee upgrade.log
      - name: uninstall.sh
        run: ./uninstall.sh --yes 2>&1 | tee uninstall.log
      - name: verify removal
        run: |
          set -euo pipefail
          test ! -e /usr/local/bin/k3s
          test ! -e ~/.rekognitor
          ! systemctl is-active --quiet k3s
      - name: diagnostics
        if: failure()
        run: |
          set +e
          export KUBECONFIG=~/.rekognitor/kubeconfig
          kubectl get all,pvc,networkpolicy -A -o wide
          kubectl get events -A --sort-by=.lastTimestamp | tail -60
          for p in $(kubectl -n rekognitor get pods -o name); do
            kubectl -n rekognitor describe "$p"; kubectl -n rekognitor logs "$p" --all-containers --tail=100
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-logs
          path: '*.log'

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: bash 3.2
        run: |
          set -euo pipefail
          /bin/bash --version | head -1
          /bin/bash -n install.sh
          /bin/bash -n uninstall.sh
          /bin/bash install.sh --help
          /bin/bash uninstall.sh --help

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: PSScriptAnalyzer
        shell: powershell
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $r = Invoke-ScriptAnalyzer -Path scripts/windows -Severity Error
          $r | Format-Table -AutoSize
          if ($r) { exit 1 }
