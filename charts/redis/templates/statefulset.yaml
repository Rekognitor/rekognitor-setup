apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.serviceName }}
spec:
  serviceName: "{{ .Values.serviceName }}"
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.serviceName }}
  template:
    metadata:
      labels:
        app: {{ .Values.serviceName }}
    spec:
      containers:
        - name: {{ .Values.serviceName }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"          
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
            - name: redis-conf
              mountPath: /conf
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"               
      volumes:
        - name: redis-data
          hostPath:
            path: /redis-data
        - name: redis-conf
          hostPath:
            path: /redis-conf