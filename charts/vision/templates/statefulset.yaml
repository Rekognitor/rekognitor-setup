apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.serviceName }}
spec:
  serviceName: "{{ .Values.serviceName }}"
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Values.serviceName }}
  template:
    metadata:
      labels:
        app: {{ .Values.serviceName }}
    spec:
      # the image runs as appuser (10001); fsGroup makes the faces volume writable
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: {{ .Values.serviceName }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: grpc
              containerPort: {{ .Values.service.port }}
          env:
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: FACES_DB_DIR
              value: {{ .Values.persistence.mountPath | quote }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          volumeMounts:
            - name: faces
              mountPath: {{ .Values.persistence.mountPath }}
          # grpc.health.v1 is served by the app; loading the face models takes a few
          # seconds, so readiness gates traffic until it reports SERVING.
          startupProbe:
            grpc:
              port: {{ .Values.service.port }}
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            grpc:
              port: {{ .Values.service.port }}
            periodSeconds: 10
          livenessProbe:
            grpc:
              port: {{ .Values.service.port }}
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: faces
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
