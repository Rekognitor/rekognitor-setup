serviceName: vision
# Keep 1: the zvec collection under FACES_DB_DIR is single-writer. Scaling out needs
# a shared vector store first.
replicaCount: 1
image:
  # built and published by rekognitor-vision/.github/workflows/docker-publish.yml
  repository: rekognitor/rekognitor-vision
  pullPolicy: Always
  tag: latest
service:
  # ClusterIP only. The service has no authentication and serves biometric data
  # (LGPD): never expose it with a LoadBalancer/NodePort/ingress.
  port: 50051
env:
  FACE_MATCH_DISTANCE: "0.6"
  FACE_MATCH_MARGIN: "0.03"
  # simultaneous face inferences; CPU-bound, keep <= the CPU limit below
  FACE_MAX_CONCURRENCY: "2"
  # "1" = CNN face detector (more accurate, much slower on CPU) instead of HOG
  FACE_USE_CNN: "0"
# Enrolled faces (zvec index + metadata + thumbnails) - mounted at FACES_DB_DIR.
persistence:
  mountPath: /data/faces
  size: 2Gi
  # "" = the cluster default (k3s: local-path)
  storageClass: ""
# Only pods with these labels may reach the gRPC port (the streamer). Requires a
# CNI that enforces NetworkPolicy (k3s' default flannel+kube-router does).
networkPolicy:
  enabled: true
  allowFrom:
    - app: streamer
resources:
  requests:
    memory: "512Mi"
    cpu: "500m"
  limits:
    memory: "2Gi"
    cpu: "2000m"
nodeSelector: {}
tolerations: []
